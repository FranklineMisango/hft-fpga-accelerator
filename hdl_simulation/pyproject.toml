"""
Institutional-Grade Infrastructure Configuration
Optiver-equivalent trading system deployment
"""

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "veritrade"
version = "1.0.0"
description = "Institutional FPGA Trading Engine"
requires-python = ">=3.10"

dependencies = [
    "pyqtgraph>=0.13.3",
    "PyQt5>=5.15.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "dataclasses-json>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

gpu = [
    "vispy>=0.14.1",
    "PyOpenGL>=3.1.5",
]

[tool.setuptools]
packages = ["dashboards", "monitoring", "backends"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_defs = true
