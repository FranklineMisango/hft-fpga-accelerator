[package]
name = "veritrade-wgpu"
version = "1.0.0"
edition = "2021"

[dependencies]
bevy = { version = "0.12", features = ["dynamic_linking"] }
wgpu = "0.17"
bevy_egui = "0.23"
nalgebra = "0.32"
ndarray = "0.15"

# Market data streaming
crossbeam-channel = "0.5"
parking_lot = "0.12"
num_cpus = "1.16"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utility
log = "0.4"
tracing = "0.1"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 2

# Institutional compliance
[package.metadata]
license = "Proprietary"
authors = ["VeriTrade Trading Systems"]
repository = "https://github.com/veritrade/fpga-engine"
documentation = "https://docs.veritrade.com"
